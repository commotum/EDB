[package]
name = "edb-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A temporal, fact-oriented database with Datalog queries and first-class source attribution"
repository = "https://github.com/commotum/EDB"
readme = "README.md"
keywords = ["database", "datalog", "temporal", "provenance", "edn"]
license = "MIT"
publish = false

[dependencies]
bigdecimal = "0.4.8"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-core = "0.3.34"
num-bigint = "0.4.6"
num-traits = "0.2.19"
native-tls = "0.2.14"
openssl = "0.10.81"
libc = "0.2.189"
postgres = "0.19.14"
postgres-native-tls = "0.5.1"
rand = "0.10.2"
sha2 = "0.10.9"
socket2 = "0.6.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync"] }
tokio-postgres = "0.7.18"
